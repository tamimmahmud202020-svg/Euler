<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Euler's formula between us</title>
<style>
:root{--cy:#22d3ee;--mg:#d946ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;color:#eee;overflow:hidden;font-family:system-ui,sans-serif}
#app{height:100%;display:flex;flex-direction:column;background:#000}
header{padding:20px 16px 4px;text-align:center}
h1{margin:0;font:italic 800 clamp(24px,7.4vw,40px)/1.15 Arial,Helvetica,sans-serif;background:linear-gradient(90deg,var(--cy),#8b8cf5 55%,var(--mg));-webkit-background-clip:text;background-clip:text;color:transparent}
#fm{text-align:center;font:italic 16px/1.65 Georgia,'Times New Roman',serif;opacity:0;transition:opacity .7s;min-height:56px;padding:0 12px}
#fm .y{color:#e879f9}#fm .i{color:#67e8f9}
main{flex:1;min-height:0;position:relative;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%}
footer{display:flex;align-items:center;gap:12px;padding:8px 16px 14px;margin:0 auto;width:100%;max-width:560px}
button{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid #333;background:#0c0c0c;color:#ddd;font-size:15px}
button:active{background:#222}
input[type=range]{flex:1;height:30px;-webkit-appearance:none;appearance:none;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--cy),var(--mg));opacity:.5}
input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--cy),var(--mg));opacity:.5}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-6.5px}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff}
</style></head><body>
<div id="app">
<header><h1>Euler's formula between us</h1></header>
<main id="m"><canvas id="c"></canvas></main>
<div id="fm"><div class="y">You &nbsp; e<sup>iωt</sup> = cos ωt + i sin ωt</div><div class="i">Me &nbsp; e<sup>−iωt</sup> = cos ωt − i sin ωt</div></div>
<footer><button id="p" aria-label="Pause">❚❚</button><input id="s" type="range" min="0" max="1000" value="0" aria-label="Time"><button id="r" aria-label="Replay">↻</button></footer>
</div>
<script>
const cv=document.getElementById('c'),m=document.getElementById('m'),g=cv.getContext('2d');
const sl=document.getElementById('s'),pb=document.getElementById('p');
let W,H,D=Math.min(devicePixelRatio||1,3);
function size(){W=m.clientWidth;H=m.clientHeight;cv.width=W*D;cv.height=H*D;g.setTransform(D,0,0,D,0,0)}
addEventListener('resize',size);size();
const wA=Math.PI/3,wB=2.2,t0=3.3,dd=2,k=.23,T=9,END=T+2.5,A0=Math.PI/2,CY='#22d3ee',MG='#d946ef',TAU=Math.PI*2;
const fm=document.getElementById('fm');
const tq=q=>{let lo=0,hi=T+2;for(let i=0;i<40;i++){const m=(lo+hi)/2;qf(m)<q?lo=m:hi=m}return lo};
let el=0,last=performance.now(),paused=false,dy=0,de=0,scrub=false,AW=.9,hs=0;
pb.onclick=()=>{paused=!paused;pb.textContent=paused?'▶':'❚❚'};
document.getElementById('r').onclick=()=>{el=0;dy=de=0;hs=0;paused=false;pb.textContent='❚❚'};
sl.addEventListener('input',()=>{scrub=true;el=sl.value/1000*END});
sl.addEventListener('change',()=>scrub=false);
let drag=null;
m.addEventListener('pointerdown',e=>drag=[e.clientX,e.clientY]);
addEventListener('pointerup',()=>drag=null);
addEventListener('pointermove',e=>{if(!drag)return;dy+=(e.clientX-drag[0])*.008;de=Math.max(-.5,Math.min(.5,de-(e.clientY-drag[1])*.006));drag=[e.clientX,e.clientY]});
const ss=x=>{x=Math.max(0,Math.min(1,x));return x*x*x*(x*(6*x-15)+10)};
// phase: slow single approach (meeting at 3s), then speeds up into the helix
const qf=t=>{const x=(t-t0)/dd;let G=0;if(x>0)G=x<1?dd*(x**6-3*x**5+2.5*x**4):dd*(.5+x-1);return wA*t+(wB-wA)*G};
const th=t=>{const q=qf(t);return q-(AW/2)*Math.sin(2*q)};
const me=t=>[Math.cos(A0-th(t)),Math.sin(A0-th(t)),-k*t];
const you=t=>[Math.cos(A0+th(t)),Math.sin(A0+th(t)),k*t];
function draw(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  if(!paused&&!scrub)el+=dt;
  if(el>END)el=0;
  if(!scrub)sl.value=el/END*1000;
  const t=Math.min(el,T);
  const tilt=ss((el-3.4)/4.2);
  AW=.9*(1-ss((el-3.2)/2.5));
  const rv=ss((el-2.4)/1.4)*(1-ss((el-5.2)/2.2));   // disc appears after the dots draw it, then fades into the helix
  const e=Math.max(.1,(90-77*tilt)*Math.PI/180+de*tilt);
  const yaw=.32*tilt+dy;
  const s=Math.min(W*.28,H*.17),cy=H/2;
  const cs=Math.cos(yaw),sn=Math.sin(yaw),se=Math.sin(e),ce=Math.cos(e);
  const Pb=p=>{const x1=p[0]*cs-p[1]*sn,y1=p[0]*sn+p[1]*cs;return [W/2+x1*s,cy-(y1*se+p[2]*ce)*s]};
  const ma=me(t),yb=you(t),dist=Math.hypot(ma[0]-yb[0],ma[1]-yb[1]);
  hs+=(Math.pow(Math.max(0,1-dist/.8),1.5)*(1-tilt)-hs)*Math.min(1,dt*5);
  const fp=Pb([(ma[0]+yb[0])/2,(ma[1]+yb[1])/2,0]),zf=1+.3*hs;
  const P=p=>{const q=Pb(p);return [fp[0]+(q[0]-fp[0])*zf+(W/2-fp[0])*.25*hs,fp[1]+(q[1]-fp[1])*zf+(cy-fp[1])*.25*hs]};
  g.clearRect(0,0,W,H);g.lineJoin='round';g.lineCap='round';
  // disc
  if(rv>.01){const c0=P([0,0,0]);
    g.beginPath();for(let i=0;i<=160;i++){const p=P([Math.cos(i/160*TAU),Math.sin(i/160*TAU),0]);i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}
    const gr=g.createLinearGradient(c0[0]-s,0,c0[0]+s,0);gr.addColorStop(0,'rgba(217,70,239,.24)');gr.addColorStop(1,'rgba(34,211,238,.24)');
    g.globalAlpha=rv;g.fillStyle=gr;g.fill();g.globalAlpha=1}
  // axes
  g.strokeStyle='#8f8f8f';g.fillStyle='#fff';g.lineWidth=1.2;
  const ax=(a,b,al)=>{if(al<.02)return;g.globalAlpha=al;const p=P(a),q=P(b);g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);g.stroke();
    const h=Math.atan2(q[1]-p[1],q[0]-p[0]);g.beginPath();g.moveTo(q[0],q[1]);
    g.lineTo(q[0]-11*Math.cos(h-.38),q[1]-11*Math.sin(h-.38));g.lineTo(q[0]-11*Math.cos(h+.38),q[1]-11*Math.sin(h+.38));g.fill();g.globalAlpha=1};
  ax([-1.55,0,0],[1.55,0,0],1);ax([0,-1.55,0],[0,1.55,0],1);ax([0,0,-2.4],[0,0,2.4],tilt);
  // axis names
  g.font='italic 14px Georgia,serif';g.fillStyle='#9a9aa6';g.textBaseline='middle';g.textAlign='left';
  {const a=P([1.55,0,0]),b=P([0,1.55,0]),c=P([0,0,2.4]);g.fillText('Re',a[0]+4,a[1]+16);g.fillText('Im',b[0]+12,b[1]+2);
   if(tilt>.02){g.globalAlpha=tilt;g.fillText('time',c[0]+12,c[1]+4);g.globalAlpha=1}}
  // trails: one smooth path each
  const trail=(f,col)=>{const n=Math.max(2,Math.floor(t*120));g.strokeStyle=col;g.lineWidth=2.6;g.beginPath();
    for(let i=0;i<=n;i++){const p=P(f(t*i/n));i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}g.stroke();return P(f(t))};
  const pm=trail(me,CY),py=trail(you,MG);
  // same place, different time: where we "met" on the plane vs. our heights
  if(tilt>.02){g.setLineDash([4,5]);g.strokeStyle='#fff';g.fillStyle='#fff';g.lineWidth=1.2;
    for(let kk=1;qf(t)>=kk*Math.PI;kk++){const tm=tq(kk*Math.PI),A=me(tm),B=you(tm),u=P(A),v=P(B),o=P([A[0],A[1],0]);
      g.globalAlpha=.75*tilt;g.beginPath();g.moveTo(u[0],u[1]);g.lineTo(v[0],v[1]);g.stroke();
      g.setLineDash([]);for(const q of [u,v]){g.beginPath();g.arc(q[0],q[1],3,0,TAU);g.fill()}
      g.globalAlpha=.9*tilt;g.beginPath();g.arc(o[0],o[1],5,0,TAU);g.stroke();g.setLineDash([4,5])}
    g.setLineDash([]);g.globalAlpha=1}
  // soft halo while they almost meet
  if(hs>.03){const mp=P([(ma[0]+yb[0])/2,(ma[1]+yb[1])/2,0]),R=16+34*hs;
    const rg=g.createRadialGradient(mp[0],mp[1],0,mp[0],mp[1],R);rg.addColorStop(0,`rgba(255,200,235,${.4*hs})`);rg.addColorStop(1,'rgba(255,200,235,0)');
    g.fillStyle=rg;g.beginPath();g.arc(mp[0],mp[1],R,0,TAU);g.fill()}
  // dots
  g.fillStyle=CY;g.beginPath();g.arc(pm[0],pm[1],6,0,TAU);g.fill();
  g.fillStyle=MG;g.beginPath();g.arc(py[0],py[1],6,0,TAU);g.fill();
  // plain labels
  g.font='bold 20px Georgia,"Times New Roman",serif';g.textBaseline='middle';
  const fl=1-tilt;
  g.fillStyle=CY;g.textAlign='left';g.fillText('Me',pm[0]+14,pm[1]-(18+4*hs)*fl+2*(1-fl));
  g.fillStyle=MG;g.textAlign='right';g.fillText('You',py[0]-14,py[1]-(18+4*hs)*fl+2*(1-fl));
  fm.style.opacity=tilt>.35?1:0;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script></body></html>
